[phases.setup]
nixPkgs = [
  "tesseract",
  "libGL",
  "glib",
  "nss",
  "atk",
  "gtk3",
  "libdrm",
  "libxkbcommon",
  "libxcomposite",
  "libxdamage",
  "libxrandr",
  "libgbm"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "python -m playwright install-deps chromium",
  "python -m playwright install chromium"
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"